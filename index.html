/* Zesto custom status popups */
#zesto-status-overlay{
  position:fixed;inset:0;z-index:9999;background:rgba(10,20,16,.58);
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(5px);
}
#zesto-status-overlay.show{display:flex}
.zesto-status-modal{
  width:min(92vw,420px);background:#fff;border-radius:24px;padding:26px 22px 22px;
  box-shadow:0 24px 70px rgba(0,0,0,.28);text-align:center;
  animation:zestoModalPop .28s ease-out;
}
@keyframes zestoModalPop{
  from{opacity:0;transform:translateY(18px) scale(.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.zesto-status-icon{
  width:82px;height:82px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;position:relative;font-size:34px;
}
.zesto-status-icon.success{background:#e7f7ef;color:#087044}
.zesto-status-icon.pending{background:#fff4dc;color:#b77900}
.zesto-status-icon.success::after{
  content:"";position:absolute;inset:-6px;border:2px solid rgba(8,112,68,.18);
  border-radius:50%;animation:zestoSuccessRing 1.35s ease-out infinite;
}
@keyframes zestoSuccessRing{
  0%{transform:scale(.82);opacity:.8}
  100%{transform:scale(1.22);opacity:0}
}
.zesto-status-icon.pending i{animation:zestoPendingPulse 1.15s ease-in-out infinite}
@keyframes zestoPendingPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.12);opacity:.65}
}
.zesto-status-title{
  margin:0 0 8px;font-family:Poppins,sans-serif;font-size:22px;color:var(--accent);
}
.zesto-status-text{
  margin:0;color:var(--muted);font-size:14px;line-height:1.55;
}
.zesto-status-note{
  margin-top:14px;padding:11px 12px;border-radius:13px;background:#f6f8f7;
  color:#4f5d55;font-size:13px;
}
.zesto-status-btn{
  margin-top:18px;width:100%;border:0;border-radius:13px;padding:13px 16px;
  background:var(--accent);color:#fff;font-weight:800;cursor:pointer;
}

function zestoDialog(mode,message,defaultValue=''){
  const ov=document.getElementById('zesto-dialog-overlay');
  const text=document.getElementById('zesto-dialog-text');
  const input=document.getElementById('zesto-dialog-input');
  const ok=document.getElementById('zesto-dialog-ok');
  const cancel=document.getElementById('zesto-dialog-cancel');
  const icon=document.getElementById('zesto-dialog-icon');
  if(!ov||!text||!input||!ok||!cancel){
    return Promise.resolve(mode==='confirm'?false:mode==='prompt'?null:undefined);
  }
  text.textContent=String(message??'');
  input.style.display=mode==='prompt'?'block':'none';
  cancel.style.display=(mode==='confirm'||mode==='prompt')?'block':'none';
  input.value=mode==='prompt'?String(defaultValue??''):'';
  icon.className=mode==='confirm'?'fa-solid fa-circle-question':mode==='prompt'?'fa-solid fa-pen':'fa-solid fa-circle-info';
  ov.classList.add('show'); ov.setAttribute('aria-hidden','false');
  if(mode==='prompt')setTimeout(()=>{input.focus();input.select()},30);
  return new Promise(resolve=>{
    const finish=v=>{
      ov.classList.remove('show');ov.setAttribute('aria-hidden','true');
      ok.onclick=null;cancel.onclick=null;input.onkeydown=null;
      resolve(v);
    };
    ok.onclick=()=>finish(mode==='prompt'?input.value:mode==='confirm'?true:undefined);
    cancel.onclick=()=>finish(mode==='prompt'?null:false);
    input.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')cancel.click()};
  });
}
function zAlert(message){return zestoDialog('alert',message)}
function zConfirm(message){return zestoDialog('confirm',message)}
function zPrompt(message,defaultValue=''){return zestoDialog('prompt',message,defaultValue)}

function showStatusPopup(type,title,text,note=''){
  const ov=$('#zesto-status-overlay'),icon=$('#zesto-status-icon'),titleEl=$('#zesto-status-title'),
        textEl=$('#zesto-status-text'),noteEl=$('#zesto-status-note'),btn=$('#zesto-status-btn');
  if(!ov||!icon||!titleEl||!textEl||!btn){zAlert(text);return Promise.resolve()}
  icon.className='zesto-status-icon '+(type==='pending'?'pending':'success');
  icon.innerHTML=type==='pending'?'<i class="fa-solid fa-hourglass-half"></i>':'<i class="fa-solid fa-check"></i>';
  titleEl.textContent=title;textEl.textContent=text;
  if(note){noteEl.textContent=note;noteEl.classList.remove('hidden')}else{noteEl.textContent='';noteEl.classList.add('hidden')}
  ov.classList.add('show');ov.setAttribute('aria-hidden','false');
  return new Promise(resolve=>{btn.onclick=()=>{ov.classList.remove('show');ov.setAttribute('aria-hidden','true');btn.onclick=null;resolve()}});
}

function mapVendor(v){
  if(!v)return null;
  return {
    ...v,firebaseKey:v.id,
    workStatus:v.online?'Active':'Inactive',
    onlineStatus:v.online?'online':'offline',
    currentLocation:{
      lat:v.latitude,lng:v.longitude,online:!!v.online,
      updatedAt:v.online_updated_at?new Date(v.online_updated_at).getTime():0
    }
  };
}
function mapProduct(p){
  return {
    ...p,firebaseKey:p.id,vendorId:p.vendor_id,
    vendorPrice:Number(p.vendor_price||0),vendorMrp:Number(p.vendor_mrp||0),
    price:Number(p.customer_price||0),priceMrp:Number(p.customer_mrp||0),
    imageUrls:Array.isArray(p.image_urls)?p.image_urls:[],
    imageUrl:Array.isArray(p.image_urls)?(p.image_urls[0]||''):'',
    active:p.stock_status!=='out_of_stock'
  };
}
function mapOrder(o){
  const items=Array.isArray(o.items)?o.items.map(i=>({
    ...i,
    productId:i.product_id||i.productId,
    qty:Number(i.quantity??i.qty??1),
    vendorPrice:Number(i.vendor_price??i.vendorPrice??0),
    price:Number(i.customer_price??i.price??0)
  })):[];
  return {
    ...o,firebaseKey:o.id,orderId:o.order_code||String(o.id||'').slice(0,8).toUpperCase(),
    vendorId:o.vendor_id,vendorName:o.vendor_name,vendorEmail:o.vendor_email||'',
    vendorStatus:o.vendor_status,deliveryStatus:o.delivery_status,deliveryOfferStatus:o.delivery_offer_status,
    vendorAcceptedAt:o.vendor_accepted_at?new Date(o.vendor_accepted_at).getTime():null,
    vendorPrepMinutes:o.preparation_minutes,
    vendorReadyAt:o.ready_at?new Date(o.ready_at).getTime():null,
    createdAt:o.created_at?new Date(o.created_at).getTime():0,
    paymentMethod:o.payment_method,paymentStatus:o.payment_status,
    items,
    customer:{
      name:o.customer_name,phone:o.customer_phone,address:o.customer_address,
      city:o.customer_city||'',pincode:o.customer_pincode||''
    },
    deliveryLocation:(o.customer_latitude!=null&&o.customer_longitude!=null)?{lat:o.customer_latitude,lng:o.customer_longitude}:null,
    deliveryBoy:o.delivery_partner_id?{id:o.delivery_partner_id}:null
  };
}

async function register(e){
 e.preventDefault();
 const email=$('#email').value.trim().toLowerCase(),password=$('#pass').value;
 if(!$('#reg-lat').value||!$('#reg-lng').value){zAlert('Please capture your current location before submitting registration.');return}
 try{
   const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:$('#owner').value.trim()||$('#name').value.trim(),phone:$('#phone').value.trim()}}});
   if(error)throw error;
   if(!data.user)throw new Error('Could not create vendor account.');
   const {error:ve}=await sb.from('vendors').insert({
     id:data.user.id,name:$('#name').value.trim(),email,phone:$('#phone').value.trim(),
     address:$('#address').value.trim(),latitude:Number($('#reg-lat').value),longitude:Number($('#reg-lng').value),
     status:'Pending',online:false
   });
   if(ve)throw ve;
   await sb.auth.signOut();
   await showStatusPopup('success','Account Created Successfully','Your vendor account has been created.','Admin approval is required before the account becomes active.');
   showAuth();
 }catch(err){console.error(err);zAlert(/already|registered/i.test(err.message||'')?'A vendor account already exists for this email.':(err.message||'Registration failed.'))}
}
async function login(e){
 e.preventDefault();
 try{
   const {data,error}=await sb.auth.signInWithPassword({email:$('#le').value.trim().toLowerCase(),password:$('#lp').value});
   if(error)throw error;
   const {data:found,error:ve}=await sb.from('vendors').select('*').eq('id',data.user.id).maybeSingle();
   if(ve)throw ve;
   if(!found){await sb.auth.signOut();toast('Vendor profile not found.');return}
   if(found.status==='Pending'){await sb.auth.signOut();await showStatusPopup('pending','Approval Pending','Your vendor registration is waiting for Admin approval.','You will be able to access the Vendor Panel after approval.');return}
   if(found.status==='Rejected'||found.status==='Blocked'){await sb.auth.signOut();toast(found.status==='Blocked'?'This vendor account is blocked.':'Your registration was rejected by Admin.');return}
   session={uid:data.user.id,email:found.email};localStorage.setItem('zesto_vendor_session',JSON.stringify(session));await loadApp();
 }catch(err){console.error(err);toast('Invalid email or password.')}
}

 .subscribe();

function orderTargetsVendor(o){return !!(o&&vendor&&String(o.vendorId||'')===String(vendor.id||''))}
function belongsToVendor(o){return orderTargetsVendor(o)}
function isClaimable(o){return !!o&&!['Delivered','Cancelled'].includes(o.status)&&!o.vendorAcceptedAt&&orderTargetsVendor(o)&&isPaymentApprovedForVendor(o)}
function isAssignedPendingVendorOrder(o){return !!o&&!['Delivered','Cancelled'].includes(o.status)&&!o.vendorAcceptedAt&&orderTargetsVendor(o)}
function paymentText(o){if(o.paymentMethod==='cod')return 'Cash on Delivery';if(o.paymentMethod==='online'||o.paymentMethod==='upi')return 'Online / UPI';return 'Not specified'}
function paymentStatus(o){if(o.paymentStatus==='paid')return 'Confirmed';if(o.paymentStatus==='processing')return 'Processing';if(o.paymentStatus==='pending')return 'Verification Pending';if(o.paymentStatus==='not_required')return 'COD';return 'Pending'}
function isPaymentApprovedForVendor(o){if(!o)return false;if(!['online','upi'].includes(o.paymentMethod))return true;return o.paymentStatus==='paid'||String(o.status||'').toLowerCase().includes('payment confirmed')}

async function captureVendorLocationOnce(){
 if(!vendor)return;
 if(!navigator.geolocation){zAlert('Geolocation is not supported on this device/browser.');return}
 navigator.geolocation.getCurrentPosition(async p=>{
   const {error}=await sb.from('vendors').update({latitude:p.coords.latitude,longitude:p.coords.longitude,online_updated_at:new Date().toISOString()}).eq('id',vendor.id);
   if(error){console.error(error);zAlert('Could not save location.');return}
   await refreshVendor();toast('Location updated successfully.');renderDashboard();
 },e=>zAlert(e.code===1?'Location permission was denied. Please allow location access.':'Could not get current location.'),
 {enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
window.captureVendorLocationOnce=captureVendorLocationOnce;

async function setVendorOnlineState(isOnline){
 if(!vendor)return;
 try{
   const {error}=await sb.from('vendors').update({online:!!isOnline,online_updated_at:new Date().toISOString()}).eq('id',vendor.id);
   if(error)throw error;
   await refreshVendor();toast(isOnline?'You are now ONLINE':'You are now OFFLINE');renderDashboard();
 }catch(err){console.error(err);zAlert('Could not update online/offline status. Please check internet connection.')}
}
window.setVendorOnlineState=setVendorOnlineState;

function renderDashboard(){
 if(!vendor)return;
 const mine=orders.filter(belongsToVendor).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const activeMine=mine.filter(o=>!(o.status==='Delivered'||o.deliveryStatus==='Delivered')&&!String(o.status||'').toLowerCase().includes('cancel'));
 const deliveredMine=mine.filter(o=>o.status==='Delivered'||o.deliveryStatus==='Delivered');
 const incomingAll=orders.filter(o=>isAssignedPendingVendorOrder(o)&&vendor.workStatus!=='Inactive').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const waitingPayment=incomingAll.filter(o=>['online','upi'].includes(o.paymentMethod)&&!isPaymentApprovedForVendor(o));
 const accepted=activeMine.filter(o=>['Vendor Accepted','Preparing','Ready for Pickup'].includes(o.vendorStatus)).length;
 const ready=activeMine.filter(o=>o.vendorStatus==='Ready for Pickup').length;
 $('#app').innerHTML=`<div class="card"><div class="row mobile-col"><div><h2 style="margin:0">Welcome, ${esc(vendor.name)}</h2><div class="muted small">${esc(vendor.email)} · ${esc(vendor.phone||'')}</div></div><span class="badge">Location Saved</span></div>
 <div class="small muted" style="margin-top:8px">Saved Location: ${vendor.currentLocation?.lat!=null?`${Number(vendor.currentLocation.lat).toFixed(6)}, ${Number(vendor.currentLocation.lng).toFixed(6)}`:'Not available'}</div>
 <div class="actions"><button class="btn btn-outline" onclick="captureVendorLocationOnce()"><i class="fa-solid fa-location-crosshairs"></i> Update Location Once</button></div></div>
 <div class="card" style="border:2px solid var(--light)"><div class="row mobile-col"><div><h3 style="margin:0"><i class="fa-solid fa-store"></i> Restaurant Status</h3><div class="small muted" style="margin-top:5px">Set your restaurant Online when accepting orders, and Offline when unavailable.</div></div><span class="badge ${vendor.online?'':'warn'}">${vendor.online?'ONLINE':'OFFLINE'}</span></div>
 <div class="actions" style="margin-top:12px"><button class="btn" onclick="setVendorOnlineState(true)" ${vendor.online?'disabled':''}><i class="fa-solid fa-circle-check"></i> Go Online</button><button class="btn btn-outline" onclick="setVendorOnlineState(false)" ${!vendor.online?'disabled':''}><i class="fa-solid fa-power-off"></i> Go Offline</button></div></div>
 <div class="grid"><div class="stat"><b>${incomingAll.length}</b><span>New Orders</span></div><div class="stat"><b>${waitingPayment.length}</b><span>Payment Pending</span></div><div class="stat"><b>${accepted}</b><span>Accepted</span></div><div class="stat"><b>${ready}</b><span>Ready</span></div></div>
 <button type="button" class="card" onclick="showMyProducts()" style="width:100%;text-align:left;cursor:pointer;color:inherit"><div class="row"><div><h3 style="margin:0"><i class="fa-solid fa-box-open" style="color:var(--accent)"></i> My Products</h3><div class="muted small" style="margin-top:5px">${products.length} products · Tap to view and manage</div></div><div style="width:42px;height:42px;border-radius:50%;background:var(--light);color:var(--accent);display:grid;place-items:center;font-size:18px;flex-shrink:0"><i class="fa-solid fa-chevron-right"></i></div></div></button>
 <button type="button" class="card" onclick="showMyVendorOrders()" style="width:100%;text-align:left;cursor:pointer;color:inherit"><div class="row"><div><h3 style="margin:0"><i class="fa-solid fa-clipboard-list" style="color:var(--accent)"></i> My Vendor Orders</h3><div class="muted small" style="margin-top:5px">${deliveredMine.length} delivered orders · Tap to view</div></div><div style="width:42px;height:42px;border-radius:50%;background:var(--light);color:var(--accent);display:grid;place-items:center;font-size:18px;flex-shrink:0"><i class="fa-solid fa-chevron-right"></i></div></div></button>
 <div class="card"><h3 style="margin-top:0">New Customer Orders (${incomingAll.length})</h3>${incomingAll.length?incomingAll.map(o=>orderHtml(o,false)).join(''):'<div class="muted">No new orders right now.</div>'}</div>
 <div class="card"><h3 style="margin-top:0">Active Vendor Orders (${activeMine.length})</h3>${activeMine.length?activeMine.map(o=>orderHtml(o,true)).join(''):'<div class="muted">No active accepted orders right now.</div>'}</div>`;
}
function showMyProducts(){
 if(!vendor)return;
 $('#app').innerHTML=`<div class="card"><div class="row mobile-col" style="align-items:flex-start"><div><button class="btn btn-outline" onclick="renderDashboard()" style="margin-bottom:12px"><i class="fa-solid fa-arrow-left"></i> Back</button><h2 style="margin:0">My Products (${products.length})</h2><div class="muted small" style="margin-top:4px">View, add, edit or delete your products.</div></div><button class="btn" onclick="showProductForm()"><i class="fa-solid fa-plus"></i> Add Product</button></div><div id="vendor-products" style="margin-top:14px">${productHtml(products)}</div></div>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
window.showMyProducts=showMyProducts;
function showMyVendorOrders(){
 const deliveredOrders=orders.filter(o=>o.status==='Delivered'||o.deliveryStatus==='Delivered').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 $('#app').innerHTML=`<div class="card"><div class="row mobile-col" style="align-items:flex-start"><div><button class="btn btn-outline" onclick="renderDashboard()" style="margin-bottom:12px"><i class="fa-solid fa-arrow-left"></i> Back</button><h2 style="margin:0">My Vendor Orders (${deliveredOrders.length})</h2><div class="muted small" style="margin-top:4px">Delivered orders are stored here.</div></div></div><div style="margin-top:14px">${deliveredOrders.length?deliveredOrders.map(o=>orderHtml(o,true)).join(''):'<div class="muted">No delivered orders yet.</div>'}</div></div>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
window.showMyVendorOrders=showMyVendorOrders;

function productHtml(list){
 if(!list.length)return '<div class="muted" style="margin-top:10px">No products yet.</div>';
 return list.map(p=>`<div class="order"><div class="row"><div><b>${esc(p.name||'Product')}</b><div class="small muted">${esc(p.category||'')} · Your Price: ${money(p.vendorPrice)}</div></div><span class="badge ${p.active?'':'warn'}">${p.active?'In Stock':'Out of Stock'}</span></div>${p.imageUrl?`<img src="${esc(p.imageUrl)}" style="width:70px;height:70px;object-fit:cover;border-radius:10px;margin-top:8px">`:''}<div class="actions"><button class="btn btn-outline" onclick="editProduct('${esc(p.id)}')">Edit</button><button class="btn btn-danger" onclick="deleteProduct('${esc(p.id)}')">Delete</button></div></div>`).join('');
}
function showProductForm(editKey=''){
 const p=products.find(x=>x.id===editKey)||{},area=$('#vendor-products');if(!area)return;
 area.innerHTML=`<div class="notice"><h3 style="margin-top:0">${editKey?'Edit':'Add'} Product</h3><label>Product Name *</label><input id="vp-name" value="${esc(p.name||'')}"><label>Your Price (₹) *</label><input id="vp-price" type="number" min="0" value="${Number(p.vendorPrice||0)}"><div class="small muted" style="margin-top:5px">This is your vendor price. Admin can set a separate customer selling price.</div><label>MRP (₹)</label><input id="vp-mrp" type="number" min="0" value="${Number(p.vendorMrp||0)}"><label>Category</label><input id="vp-cat" value="${esc(p.category||'')}"><label>Stock Status</label><select id="vp-stock"><option value="in" ${p.active===false?'':'selected'}>In Stock</option><option value="out" ${p.active===false?'selected':''}>Out of Stock</option></select><div class="small muted" style="margin-top:5px">Out of Stock products will not be available for customers to order.</div><label>Image</label><input id="vp-img-file" type="file" accept="image/*"><input id="vp-img" placeholder="Or image URL" value="${esc(p.imageUrl||'')}"><div class="actions"><button class="btn" onclick="saveProduct('${esc(editKey)}')">Save Product</button><button class="btn btn-outline" onclick="showMyProducts()">Cancel</button></div></div>`;
}
async function uploadProductImage(file){
 const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'')||'jpg';
 const path=`vendors/${vendor.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
 const {error}=await sb.storage.from('zesto-images').upload(path,file,{upsert:false,contentType:file.type||undefined});
 if(error)throw error;
 return sb.storage.from('zesto-images').getPublicUrl(path).data.publicUrl;
}
async function saveProduct(key){
 if(!vendor)return;
 try{
   const name=$('#vp-name').value.trim(),price=Number($('#vp-price').value||0),mrp=Number($('#vp-mrp').value||0),category=$('#vp-cat').value.trim(),inStock=$('#vp-stock').value!=='out';
   if(!name||price<0){zAlert('Enter product name and valid price.');return}
   let imageUrl=$('#vp-img').value.trim(),f=$('#vp-img-file').files?.[0];
   if(f){if(f.size>1200000){zAlert('Image must be under 1.2 MB.');return}imageUrl=await uploadProductImage(f)}
   const payload={vendor_id:vendor.id,name,category,image_urls:imageUrl?[imageUrl]:[],vendor_price:price,vendor_mrp:mrp,stock_status:inStock?'in_stock':'out_of_stock',active:true};
   let q;
   if(key)q=sb.from('products').update(payload).eq('id',key).eq('vendor_id',vendor.id);
   else q=sb.from('products').insert(payload);
   const {error}=await q;if(error)throw error;
   await refreshProducts();toast('Product saved.');showMyProducts();
 }catch(err){console.error(err);zAlert(err.message||'Could not save product.')}
}
function editProduct(k){showProductForm(k)}
async function deleteProduct(k){
 const p=products.find(x=>x.id===k);if(!p||!await zConfirm('Delete this product?'))return;
 const {error}=await sb.from('products').delete().eq('id',k).eq('vendor_id',vendor.id);
 if(error){zAlert(error.message);return}await refreshProducts();toast('Product deleted.');showMyProducts();
}
window.showProductForm=showProductForm;window.saveProduct=saveProduct;window.editProduct=editProduct;window.deleteProduct=deleteProduct;

function vendorOrderAmount(o){
 if(Number.isFinite(Number(o.vendor_total))&&Number(o.vendor_total)>0)return Number(o.vendor_total);
 return (o.items||[]).reduce((sum,i)=>sum+(Number(i.vendorPrice||0)*Math.max(1,Number(i.qty)||1)),0);
}
function orderHtml(o,mine){
 const vs=o.vendorStatus||'New';
 const readyAt=o.vendorReadyAt?new Date(o.vendorReadyAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
 return `<div class="order"><div class="row"><b>#${esc(o.orderId||'')}</b><span class="badge ${vs==='Ready for Pickup'?'':'warn'}">${esc(vs)}</span></div>
 <div style="font-weight:800;margin-top:8px">${esc(o.customer?.name||'Customer')}</div>
 <div class="muted small"><i class="fa-solid fa-phone"></i> ${esc(o.customer?.phone||'—')}</div>
 <div class="muted small" style="margin-top:4px"><i class="fa-solid fa-location-dot"></i> ${esc(o.customer?.address||'—')}, ${esc(o.customer?.city||'')} ${esc(o.customer?.pincode||'')}</div>
 <div class="small" style="margin-top:8px"><b>Items:</b> ${esc((o.items||[]).map(i=>`${i.name||'Product'} × ${i.qty||1}`).join(', ')||'—')}</div>
 <div class="small" style="margin-top:7px"><b>Your Order Amount:</b> ${money(vendorOrderAmount(o))} &nbsp; <b>Payment:</b> ${esc(paymentText(o))} · ${esc(paymentStatus(o))}</div>
 ${o.vendorPrepMinutes?`<div class="notice small"><b>Preparation:</b> ${esc(o.vendorPrepMinutes)} minutes · ETA ${readyAt}</div>`:''}
 ${o.deliveryBoy?`<div class="notice small"><b>Delivery Boy:</b> ${esc(o.deliveryBoy.name||'Assigned')} · ${esc(o.deliveryStatus||'Assigned')}</div>`:''}
 <div class="actions">
 ${!mine?(isPaymentApprovedForVendor(o)?`<button class="btn" onclick="acceptOrder('${esc(o.id)}')"><i class="fa-solid fa-check"></i> Accept Order</button>`:`<button class="btn" disabled style="opacity:.55;cursor:not-allowed"><i class="fa-solid fa-lock"></i> Waiting for Payment Confirmation</button><div class="notice small" style="width:100%;background:#fff7db;color:#8a6200"><b>Online payment not confirmed yet.</b><br>Admin must confirm the UPI payment before you can accept this order.</div>`):
 vs==='Vendor Accepted'?`<button class="btn" onclick="setPrep('${esc(o.id)}')"><i class="fa-solid fa-stopwatch"></i> Set Preparation Time</button>`:
 vs==='Preparing'?`<button class="btn" onclick="markReady('${esc(o.id)}')"><i class="fa-solid fa-circle-check"></i> Mark Ready</button>`:
 vs==='Ready for Pickup'?`<span class="badge">Waiting for Delivery Pickup</span>`:''}
 ${o.customer?.phone?`<a class="btn btn-outline" href="tel:${esc(o.customer.phone)}"><i class="fa-solid fa-phone"></i> Call Customer</a>`:''}
 ${o.deliveryLocation?`<a class="btn btn-outline" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(String(o.deliveryLocation.lat)+','+String(o.deliveryLocation.lng))}"><i class="fa-solid fa-map-location-dot"></i> Location</a>`:''}
 </div></div>`;
}
async function acceptOrder(key){
 if(!vendor)return;
 const o=orders.find(x=>x.id===key);if(!o)return;
 if(!isPaymentApprovedForVendor(o)){toast('Payment is not confirmed by Admin yet. You cannot accept this order.');return}
 const now=new Date().toISOString();
 const {data,error}=await sb.from('orders').update({
   vendor_status:'Vendor Accepted',vendor_accepted_at:now,
   delivery_offer_status:'Available',delivery_status:'Waiting for Delivery',status:'Restaurant Accepted'
 }).eq('id',key).eq('vendor_id',vendor.id).is('vendor_accepted_at',null).select('id').maybeSingle();
 if(error){console.error(error);toast('Order could not be accepted. Refresh the page and try again.');return}
 if(!data){toast('Order could not be accepted. It may already have changed.');return}
 await refreshOrders();toast('Order accepted successfully.');renderDashboard();
}
async function setPrep(key){
 const v=await zPrompt('How many minutes will the order take to be ready?','20');if(v===null)return;
 const min=Math.max(1,Math.floor(Number(v)||0));if(!min){toast('Enter a valid number of minutes.');return}
 const {error}=await sb.from('orders').update({preparation_minutes:min,vendor_status:'Preparing',delivery_offer_status:'Available',status:'Preparing'}).eq('id',key).eq('vendor_id',vendor.id);
 if(error){zAlert(error.message);return}await refreshOrders();toast(`Preparation time set to ${min} minutes.`);renderDashboard();
}
async function markReady(key){
 const {error}=await sb.from('orders').update({vendor_status:'Ready for Pickup',ready_at:new Date().toISOString(),delivery_offer_status:'Available',status:'Ready for Pickup'}).eq('id',key).eq('vendor_id',vendor.id);
 if(error){zAlert(error.message);return}await refreshOrders();toast('Order marked Ready for Pickup. Delivery can pick it up now.');renderDashboard();
}
window.acceptOrder=acceptOrder;window.setPrep=setPrep;window.markReady=markReady;

(async function init(){
 try{
   const {data:{session:s}}=await sb.auth.getSession();
   if(s?.user){
     session={uid:s.user.id,email:s.user.email};localStorage.setItem('zesto_vendor_session',JSON.stringify(session));
     const {data:v}=await sb.from('vendors').select('id,status').eq('id',s.user.id).maybeSingle();
     if(v?.status==='Approved'){await loadApp();return}
     await sb.auth.signOut();localStorage.removeItem('zesto_vendor_session');session=null;
   }
 }catch(e){console.error(e)}
 showAuth();
})();

</script></body></html>
